name: Release

# Push a tag like v1.2.0 (or v1.3.0-beta.1) to publish every package in the repo.
on:
  push:
    tags: ['v*']

permissions:
  contents: write     # create the GitHub Release
  id-token: write     # required for nuget.org Trusted Publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    environment: nuget  # optional: add required reviewers in repo settings for a manual approval gate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build
      # tests/mtp/global.json switches dotnet test to Microsoft.Testing.Platform mode.
      - run: dotnet test --solution Specs.Mtp.slnx -c Release
        working-directory: tests/mtp
      - run: dotnet pack -c Release --no-build -o artifacts

      # Exchanges the GitHub OIDC token for a 1-hour nuget.org API key. No stored secret key.
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}   # your nuget.org profile name, not your email

      # Pushes core + extensions together; .snupkg symbol packages go up alongside automatically.
      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" artifacts/*.nupkg
          --generate-notes
          ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
