name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'documents/**'
      - 'memory-bank/**'
      - 'LICENSE'
      - '.github/skills/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'documents/**'
      - 'memory-bank/**'
      - 'LICENSE'
      - '.github/skills/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # MinVer needs full history + tags to compute the version

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The root holds two solutions, so each command names one explicitly.
      - run: dotnet restore Specs.sln
      - run: dotnet build Specs.sln -c Release --no-restore
      - run: dotnet test Specs.sln -c Release --no-build
      # tests/mtp/global.json switches dotnet test to Microsoft.Testing.Platform mode.
      - run: dotnet test --solution ../../Specs.Mtp.slnx -c Release
        working-directory: tests/mtp
      # Specs.sln contains every packable project, including specs.BDD.TestingPlatform and specs.BDD.Templates.
      - run: dotnet pack Specs.sln -c Release --no-build -o artifacts

      # Installs the packed template, scaffolds every flavour (C# and VB) against the just-built packages, and runs them.
      - name: Smoke-test templates
        run: |
          unzip -l artifacts/specs.BDD.Templates.*.nupkg
          dotnet nuget add source "$GITHUB_WORKSPACE/artifacts" --name local-artifacts
          dotnet new install artifacts/specs.BDD.Templates.*.nupkg
          mkdir "$RUNNER_TEMP/tpl" && cd "$RUNNER_TEMP/tpl"
          dotnet new specs-vstest -n Demo.Vs
          dotnet new specs-mtp -n Demo.Mtp
          dotnet new specs-vstest -lang VB -n Demo.VsVb
          dotnet new specs-mtp -lang VB -n Demo.MtpVb
          dotnet test Demo.Vs -c Release
          dotnet run --project Demo.Mtp -c Release
          dotnet test Demo.VsVb -c Release
          dotnet run --project Demo.MtpVb -c Release

      # Download from the run page to inspect exactly what a release would ship
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/
